# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) →
# EAS builds an Android APK in the cloud → it is attached to a GitHub Release for that tag.
#
# One-time setup:
#   1. `npx eas-cli@latest init` locally and commit the projectId it writes into app.json.
#   2. Create an access token at https://expo.dev/settings/access-tokens and save it in
#      GitHub → Settings → Secrets and variables → Actions as EXPO_TOKEN.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # free-tier EAS builds can wait in a queue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build the APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Download the APK
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          test -n "$url" && test "$url" != "null"
          curl -fL -o "hulhul-${GITHUB_REF_NAME}.apk" "$url"

      - uses: softprops/action-gh-release@v2
        with:
          name: 훌훌 ${{ github.ref_name }}
          files: hulhul-*.apk
          generate_release_notes: true
          body: |
            ### 설치 (안드로이드)
            1. 아래 **hulhul-${{ github.ref_name }}.apk** 를 휴대폰에서 다운로드
            2. 파일을 열고, "출처를 알 수 없는 앱 설치"를 허용
            3. 설치 → 홈 화면의 구름 아이콘 **훌훌**

            아이폰은 설치 파일로 배포할 수 없어요 — README의 "아이폰" 안내를 참고하세요.
